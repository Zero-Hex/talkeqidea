name: Build Go Binaries and Prep Release
on: [push]
jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin the toolchain rather than inheriting whatever the runner ships.
      # go.mod requires 1.24, and an unpinned runner silently changing version
      # is the kind of thing that breaks a release build at the worst moment.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
      - run: make set-version-${{github.run_number}}
      - run: go mod download
      - run: go vet -printf.funcs=Debugf,Infof,Warnf,Errorf,Fatalf,Panicf ./...
      - run: go test -race -tags ci,wayland ./...
      - run: make build-all
      - uses: "marvinpinto/action-automatic-releases@latest"
        if: github.ref == 'refs/heads/master'
        with:
          repo_token: "${{secrets.GITHUB_TOKEN}}"
          automatic_release_tag: "${{env.VERSION}}"
          prerelease: true
          title: "${{env.VERSION}}"
          files: |
            bin/talkeq-linux
            bin/talkeq-windows.exe
            bin/talkeq-darwin
            bin/talkeq-hub-linux
            bin/talkeq-hub-windows.exe
            bin/talkeq-hub-darwin
            bin/talkeq-agent-linux
            bin/talkeq-agent-windows.exe
            bin/talkeq-agent-darwin